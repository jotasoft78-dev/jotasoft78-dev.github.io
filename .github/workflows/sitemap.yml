name: Generar sitemap

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sitemap:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Generar sitemap.xml con anclajes de aplicaciones
        shell: bash
        run: |
          python3 <<'PY'
          import re
          from pathlib import Path
          from urllib.parse import quote

          BASE_URL = "https://jotasoft78-dev.github.io"
          index_path = Path("index.html")

          urls = [BASE_URL + "/"]

          if index_path.exists():
              html_content = index_path.read_text(encoding="utf-8")
              # Extrae los IDs de las tarjetas (que genera tu script generaweb.py)
              matches = re.findall(r'<article[^>]+id="([^"]+)"', html_content)
              for app_id in matches:
                  urls.append(f"{BASE_URL}/#{app_id}")

          urls = sorted(set(urls))

          lines = [
              '<?xml version="1.0" encoding="UTF-8"?>',
              '<urlset xmlns="http://www.sitemaps.org/schemas/sitemap/0.9">'
          ]

          for url in urls:
              lines.append("  <url>")
              lines.append(f"    <loc>{quote(url, safe=':/#')}</loc>")
              lines.append("  </url>")

          lines.append("</urlset>")

          Path("sitemap.xml").write_text(
              "\n".join(lines) + "\n",
              encoding="utf-8"
          )

          print(f"Sitemap generado correctamente con {len(urls)} URLs.")
          PY

      - name: Guardar sitemap.xml
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add sitemap.xml

          if git diff --cached --quiet; then
            echo "No hay cambios en sitemap.xml"
          else
            git commit -m "Actualizar sitemap.xml con anclajes de aplicaciones"
            git pull origin main --rebase
            git push origin HEAD:main
          fi