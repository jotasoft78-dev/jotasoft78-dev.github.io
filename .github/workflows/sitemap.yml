name: Generar sitemap

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sitemap:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Generar sitemap.xml válido para Google
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          BASE_URL = "https://jotasoft78-dev.github.io"

          # Google solo requiere la página principal ya que es una SPA de una sola página
          urls = [BASE_URL + "/"]

          lines = [
              '<?xml version="1.0" encoding="UTF-8"?>',
              '<urlset xmlns="http://www.sitemaps.org/schemas/sitemap/0.9">'
          ]

          for url in urls:
              lines.append("  <url>")
              lines.append(f"    <loc>{url}</loc>")
              lines.append("  </url>")

          lines.append("</urlset>")

          Path("sitemap.xml").write_text(
              "\n".join(lines) + "\n",
              encoding="utf-8"
          )

          print("Sitemap válido generado correctamente.")
          PY

      - name: Guardar sitemap.xml
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add sitemap.xml

          if git diff --cached --quiet; then
            echo "No hay cambios en sitemap.xml"
          else
            git commit -m "Actualizar sitemap.xml válido sin anclajes"
            git pull origin main --rebase
            git push origin HEAD:main
          fi