name: Generar web JotaSoft78

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generar-web:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Ejecutar generador
        run: |
          python generar.py

      - name: Comprobar archivos generados
        run: |
          echo "=== index.html ==="
          ls -lh index.html

          echo "=== urls.txt ==="
          ls -lh urls.txt

          echo "=== Contenido urls.txt ==="
          cat urls.txt

      - name: Guardar cambios
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add index.html urls.txt

          if git diff --cached --quiet; then
            echo "No hay cambios que guardar."
          else
            git commit -m "Actualizar web y listado de programas"
            git push
          fi